# Codegen config for the desktop gRPC-Web client.
#
# Regenerate after editing ../../proto/**:
#   cd apps/desktop && bunx buf generate
#
# Output is committed under src/lib/gen/ so the build needs no codegen step.
# Uses Connect-ES v2 (@connectrpc/connect ^2) + protobuf-es v2
# (@bufbuild/protobuf ^2). In v2, protoc-gen-es emits both messages AND the
# service descriptor (used by createClient(Gitdeck, transport)), so no separate
# protoc-gen-connect-es plugin is needed.
version: v2
inputs:
  - directory: ../../proto
plugins:
  - local: protoc-gen-es
    out: src/lib/gen
    opt:
      - target=ts
